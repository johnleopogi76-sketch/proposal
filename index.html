<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CasaHome — Boarding House Management System"
    >

    <title>CasaHome — Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           LOGIN PAGE
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8fafc;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        /* =====================================================
           BRAND
           ===================================================== */

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #10b981;
            border-radius: 18px;

            box-shadow:
                0 12px 30px rgba(16, 185, 129, 0.20);
        }

        .login-logo .logo-c {
            color: #ffffff;
            font-size: 25px;
            font-weight: 900;
            line-height: 1;
        }

        .login-logo .logo-h {
            color: #0f172a;
            font-size: 25px;
            font-weight: 900;
            line-height: 1;
        }

        .login-brand h1 {
            margin: 0;
            color: #0f172a;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .login-brand p {
            margin: 6px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        /* =====================================================
           LOGIN CARD
           ===================================================== */

        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 28px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.08);
        }

        .login-card h2 {
            margin: 0;
            color: #0f172a;
            font-size: 22px;
            font-weight: 800;
        }

        .login-card-subtitle {
            margin: 7px 0 24px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        /* =====================================================
           ROLE SELECTION
           ===================================================== */

        .role-label {
            display: block;
            margin-bottom: 9px;

            color: #334155;
            font-size: 13px;
            font-weight: 800;
        }

        .role-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .role-btn {
            min-height: 48px;

            border: 1px solid #cbd5e1;
            border-radius: 11px;

            background: #ffffff;
            color: #475569;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .role-btn:hover {
            border-color: #94a3b8;
            transform: translateY(-1px);
        }

        .role-btn.active {
            background: #ecfdf5;
            border-color: #10b981;
            color: #047857;
        }

        .role-btn span {
            display: block;
            margin-bottom: 2px;
            font-size: 17px;
        }

        /* =====================================================
           FORM
           ===================================================== */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;

            color: #334155;
            font-size: 13px;
            font-weight: 800;
        }

        .form-group input {
            width: 100%;
            height: 46px;

            padding: 0 13px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            background: #ffffff;
            color: #0f172a;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            border-color: #10b981;

            box-shadow:
                0 0 0 3px rgba(16, 185, 129, 0.12);
        }

        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .login-btn {
            width: 100%;
            min-height: 48px;

            border: 0;
            border-radius: 11px;

            background: #10b981;
            color: #ffffff;

            font-family: inherit;
            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .login-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* =====================================================
           ERROR / SUCCESS MESSAGE
           ===================================================== */

        .login-message {
            display: none;

            margin-bottom: 17px;
            padding: 12px 14px;

            border-radius: 10px;

            font-size: 13px;
            font-weight: 700;
            line-height: 1.45;
        }

        .login-message.error {
            display: block;

            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .login-message.success {
            display: block;

            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #047857;
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .login-footer {
            text-align: center;
            margin-top: 20px;
        }

        .login-footer p {
            margin: 0;

            color: #94a3b8;
            font-size: 12px;
        }

        /* =====================================================
           DEMO ACCOUNT NOTE
           ===================================================== */

        .demo-note {
            margin-top: 18px;
            padding: 13px 14px;

            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;

            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .demo-note strong {
            color: #334155;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 480px) {

            .login-page {
                padding: 16px;
            }

            .login-card {
                padding: 22px 18px;
                border-radius: 16px;
            }

            .login-brand {
                margin-bottom: 22px;
            }

            .login-brand h1 {
                font-size: 25px;
            }

            .role-buttons {
                gap: 8px;
            }

            .role-btn {
                font-size: 12px;
            }
        }
    </style>
</head>


<body>

<div class="login-page">

    <div class="login-container">


        <!-- =================================================
             BRAND
             ================================================= -->

        <div class="login-brand">

            <div class="login-logo">

                <span class="logo-c">C</span>
                <span class="logo-h">H</span>

            </div>

            <h1>
                CasaHome
            </h1>

            <p>
                Boarding House Management System
            </p>

        </div>


        <!-- =================================================
             LOGIN CARD
             ================================================= -->

        <div class="login-card">

            <h2>
                Welcome back
            </h2>

            <p class="login-card-subtitle">
                Sign in to access your CasaHome account.
            </p>


            <!-- =============================================
                 ROLE
                 ============================================= -->

            <label class="role-label">
                Login as
            </label>


            <div class="role-buttons">

                <button
                    type="button"
                    id="adminRoleBtn"
                    class="role-btn active">

                    <span>🛡</span>

                    Admin

                </button>


                <button
                    type="button"
                    id="userRoleBtn"
                    class="role-btn">

                    <span>👤</span>

                    Tenant

                </button>

            </div>


            <!-- =============================================
                 MESSAGE
                 ============================================= -->

            <div
                id="loginMessage"
                class="login-message">
            </div>


            <!-- =============================================
                 LOGIN FORM
                 ============================================= -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn">

                    Login

                </button>

            </form>


            <!-- =============================================
                 DEMO NOTE
                 ============================================= -->

            <div
                id="demoNote"
                class="demo-note">

                <strong>Admin access:</strong>
                Use your registered administrator account.

            </div>

        </div>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="login-footer">

            <p>
                © 2026 CasaHome · Academic/Testing System
            </p>

        </div>

    </div>

</div>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script src="assets/js/supabase.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {


        /* =================================================
           ELEMENTS
           ================================================= */

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginBtn =
            document.getElementById("loginBtn");

        const loginMessage =
            document.getElementById("loginMessage");

        const adminRoleBtn =
            document.getElementById("adminRoleBtn");

        const userRoleBtn =
            document.getElementById("userRoleBtn");

        const demoNote =
            document.getElementById("demoNote");


        /* =================================================
           SELECTED ROLE
           ================================================= */

        let selectedRole = "admin";


        /* =================================================
           MESSAGE
           ================================================= */

        function showMessage(
            message,
            type = "error"
        ) {

            loginMessage.textContent =
                message;

            loginMessage.className =
                `login-message ${type}`;

        }


        function clearMessage() {

            loginMessage.textContent =
                "";

            loginMessage.className =
                "login-message";

        }


        /* =================================================
           ROLE SELECTION
           ================================================= */

        adminRoleBtn.addEventListener(
            "click",
            () => {

                selectedRole = "admin";


                adminRoleBtn.classList.add(
                    "active"
                );

                userRoleBtn.classList.remove(
                    "active"
                );


                demoNote.innerHTML = `
                    <strong>Admin access:</strong>
                    Use your registered administrator account.
                `;


                clearMessage();

            }
        );


        userRoleBtn.addEventListener(
            "click",
            () => {

                selectedRole = "user";


                userRoleBtn.classList.add(
                    "active"
                );

                adminRoleBtn.classList.remove(
                    "active"
                );


                demoNote.innerHTML = `
                    <strong>Demo tenant:</strong>
                    Mr. Juan Dela Cruz
                `;


                clearMessage();

            }
        );


        /* =================================================
           LOGIN
           ================================================= */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                clearMessage();


                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password."
                    );

                    return;

                }


                /* Disable button */

                loginBtn.disabled = true;

                loginBtn.textContent =
                    "Signing in...";


                try {


                    /* =====================================
                       GET SUPABASE CLIENT
                       ===================================== */

                    const client =
                        await getClient();


                    /* =====================================
                       SIGN IN
                       ===================================== */

                    const {
                        data: authData,
                        error: authError
                    } = await client.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                    if (authError) {

                        throw authError;

                    }


                    const user =
                        authData.user;


                    if (!user) {

                        throw new Error(
                            "Unable to sign in."
                        );

                    }


                    /* =====================================
                       GET PROFILE
                       ===================================== */

                    const {
                        data: profile,
                        error: profileError
                    } = await client
                        .from("profiles")
                        .select(
                            "role, tenant_id"
                        )
                        .eq(
                            "id",
                            user.id
                        )
                        .maybeSingle();


                    if (profileError) {

                        throw profileError;

                    }


                    /* =====================================
                       NO PROFILE
                       ===================================== */

                    if (!profile) {

                        await client.auth.signOut();

                        throw new Error(
                            "Your account does not have a profile record yet."
                        );

                    }


                    /* =====================================
                       ADMIN LOGIN
                       ===================================== */

                    if (
                        selectedRole === "admin"
                    ) {


                        if (
                            profile.role !== "admin"
                        ) {

                            await client.auth.signOut();

                            throw new Error(
                                "This account is not registered as an administrator."
                            );

                        }


                        showMessage(
                            "Admin login successful. Redirecting...",
                            "success"
                        );


                        window.location.replace(
                            "admin-index.html"
                        );


                        return;

                    }


                    /* =====================================
                       TENANT LOGIN
                       ===================================== */

                    if (
                        selectedRole === "user"
                    ) {


                        if (
                            profile.role !== "user"
                        ) {

                            await client.auth.signOut();

                            throw new Error(
                                "This account is not registered as a tenant."
                            );

                        }


                        if (
                            !profile.tenant_id
                        ) {

                            await client.auth.signOut();

                            throw new Error(
                                "This tenant account is not linked to a tenant record yet."
                            );

                        }


                        showMessage(
                            "Tenant login successful. Redirecting...",
                            "success"
                        );


                        window.location.replace(
                            "user-dashboard.html"
                        );


                        return;

                    }


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    let message =
                        "Unable to sign in. Please check your account details.";


                    if (
                        error?.message
                    ) {

                        message =
                            error.message;

                    }


                    showMessage(
                        message,
                        "error"
                    );


                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        "Login";

                }

            }
        );


        /* =================================================
           CHECK EXISTING SESSION
           ================================================= */

        try {

            const client =
                await getClient();


            const {
                data: {
                    session
                }
            } = await client.auth.getSession();


            if (session) {


                /* =========================================
                   Get existing profile
                   ========================================= */

                const {
                    data: profile
                } = await client
                    .from("profiles")
                    .select(
                        "role, tenant_id"
                    )
                    .eq(
                        "id",
                        session.user.id
                    )
                    .maybeSingle();


                if (profile) {


                    /* ================================
                       Existing Admin Session
                       ================================ */

                    if (
                        profile.role === "admin"
                    ) {

                        window.location.replace(
                            "admin-index.html"
                        );

                        return;

                    }


                    /* ================================
                       Existing Tenant Session
                       ================================ */

                    if (
                        profile.role === "user" &&
                        profile.tenant_id
                    ) {

                        window.location.replace(
                            "user-dashboard.html"
                        );

                        return;

                    }

                }

            }

        } catch (error) {

            /*
             * Do not block the login page if the
             * existing-session check fails.
             */

            console.warn(
                "Session check:",
                error
            );

        }

    }

);

</script>

</body>
</html>
