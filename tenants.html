<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CasaHome customer directory"
    >

    <title>Customers</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/images/casahome-logo.png">

    <style>
        /* Admin mode indicator */
        .admin-context {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-left: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
            font-size: 12px;
            font-weight: 700;
            vertical-align: middle;
        }

        .admin-context-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
        }

        @media (max-width: 650px) {
            .admin-context {
                display: inline-flex;
                margin-left: 0;
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                <span class="logo-c">C</span>
                <span class="logo-h">H</span>
            </div>

            <div>
                <h1>CasaHome</h1>
                <span>Management System</span>
            </div>

        </div>

        <nav class="sidebar-nav">

            <!-- Automatically changes to admin-index.html for admins -->
            <a href="index.html"
               id="dashboardLink"
               class="nav-link">

                <span>▦</span>
                Dashboard

            </a>

            <a href="rooms.html" class="nav-link">

                <span>▤</span>
                Rooms

            </a>

            <a href="tenants.html" class="nav-link active">

                <span>♙</span>
                Customers

            </a>

            <a href="billing.html" class="nav-link">

                <span>₱</span>
                Billing

            </a>

        </nav>

        <div class="sidebar-footer">
            <strong>CasaHome</strong>
            <small>Web-based prototype</small>
        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <p class="eyebrow">
                    Directory
                </p>

                <h2>

                    Customer Directory

                    <span
                        id="adminContext"
                        class="admin-context"
                        style="display:none;"
                    >
                        <span class="admin-context-dot"></span>
                        Admin Mode
                    </span>

                </h2>

                <p class="subtitle">
                    Search and manage boarding house customers.
                </p>

            </div>

        </header>


        <section class="card">

            <div class="directory-toolbar">

                <div class="search-box">

                    <span>⌕</span>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search customers, rooms, contact..."
                        autocomplete="off"
                    >

                </div>

                <div
                    id="customerCount"
                    class="result-count"
                >
                    Loading...
                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Customer</th>
                            <th>Contact</th>
                            <th>Room</th>
                            <th>Type</th>
                            <th>Move-in Date</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody id="tenantTable">

                        <tr>

                            <td
                                colspan="6"
                                class="empty-state"
                            >
                                Loading customers...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script src="assets/js/supabase.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

    const searchInput =
        document.getElementById("searchInput");

    const tenantTable =
        document.getElementById("tenantTable");

    const customerCount =
        document.getElementById("customerCount");

    const dashboardLink =
        document.getElementById("dashboardLink");

    const adminContext =
        document.getElementById("adminContext");

    let tenants = [];


    /*
     * Detect whether the current browser session
     * belongs to an administrator.
     */
    async function setupNavigation() {

        try {

            const client =
                await getClient();


            const {
                data: {
                    session
                }
            } = await client.auth.getSession();


            /*
             * No logged-in user.
             * Keep the normal public dashboard.
             */
            if (!session) {

                dashboardLink.href =
                    "index.html";

                return;
            }


            /*
             * Check the user's role
             * from the profiles table.
             */
            const {
                data: profile,
                error
            } = await client
                .from("profiles")
                .select("role")
                .eq("id", session.user.id)
                .maybeSingle();


            if (error) {

                console.error(
                    "Unable to check user role:",
                    error
                );

                dashboardLink.href =
                    "index.html";

                return;
            }


            /*
             * Admin detected.
             */
            if (profile?.role === "admin") {

                dashboardLink.href =
                    "admin-index.html";

                adminContext.style.display =
                    "inline-flex";

            } else {

                dashboardLink.href =
                    "index.html";

            }

        } catch (error) {

            console.error(
                "Navigation setup error:",
                error
            );

            dashboardLink.href =
                "index.html";
        }

    }


    function renderTenants(list) {

        customerCount.textContent =
            `${list.length} customer${list.length !== 1 ? "s" : ""}`;


        if (!list.length) {

            tenantTable.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="empty-state"
                    >
                        No customers match your search.
                    </td>
                </tr>
            `;

            return;
        }


        tenantTable.innerHTML = list.map(tenant => {

            const room =
                tenant.rooms?.room_number || "—";

            const roomType =
                tenant.rooms?.room_type || "—";


            return `

                <tr>

                    <td>

                        <div class="customer-cell">

                            <div class="avatar">

                                ${esc(
                                    (tenant.full_name || "?")
                                    .charAt(0)
                                    .toUpperCase()
                                )}

                            </div>

                            <div>

                                <strong>
                                    ${esc(tenant.full_name)}
                                </strong>

                                <small>
                                    Customer #${tenant.id}
                                </small>

                            </div>

                        </div>

                    </td>


                    <td>
                        ${esc(
                            tenant.contact_number || "—"
                        )}
                    </td>


                    <td>

                        <strong>
                            ${esc(room)}
                        </strong>

                    </td>


                    <td>
                        ${esc(roomType)}
                    </td>


                    <td>
                        ${date(tenant.move_in_date)}
                    </td>


                    <td>

                        <span
                            class="badge ${statusClass(tenant.status)}"
                        >
                            ${esc(tenant.status)}
                        </span>

                    </td>

                </tr>

            `;

        }).join("");

    }


    function filterTenants() {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!query) {

            renderTenants(tenants);

            return;
        }


        const filtered =
            tenants.filter(tenant => {

                const values = [

                    tenant.full_name,

                    tenant.contact_number,

                    tenant.status,

                    tenant.rooms?.room_number,

                    tenant.rooms?.room_type

                ];


                return values
                    .filter(Boolean)
                    .some(value =>
                        String(value)
                            .toLowerCase()
                            .includes(query)
                    );

            });


        renderTenants(filtered);

    }


    async function loadTenants() {

        try {

            tenants =
                await fetchTenants();

            renderTenants(tenants);

        } catch (error) {

            console.error(error);

            customerCount.textContent =
                "Unable to load";


            tenantTable.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty-state error"
                    >
                        Unable to load customer data.
                    </td>

                </tr>

            `;

        }

    }


    searchInput.addEventListener(
        "input",
        filterTenants
    );


    /*
     * Detect admin first.
     */
    await setupNavigation();


    /*
     * Then load customers.
     */
    await loadTenants();


    /*
     * Keep customers updated in realtime.
     */
    subscribeToTenants(loadTenants);

});

</script>

</body>
</html>
