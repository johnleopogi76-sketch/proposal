<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CasaHome — My Profile"
    >

    <title>CasaHome — My Profile</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .page-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 22px;
            margin-top: 20px;
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #ecfdf5;
            color: #047857;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .btn-user {
            background: #10b981;
            color: #ffffff;
            border: 1px solid #10b981;
        }

        .btn-user:hover {
            background: #059669;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }

        .profile-avatar {
            width: 62px;
            height: 62px;
            min-width: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #10b981;
            color: white;

            border-radius: 50%;

            font-size: 23px;
            font-weight: 900;
        }

        .profile-name {
            color: #0f172a;
            font-size: 20px;
            font-weight: 900;
        }

        .profile-email {
            margin-top: 4px;
            color: #64748b;
            font-size: 13px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .info-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
        }

        .info-item span {
            display: block;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .info-item strong {
            display: block;
            color: #0f172a;
            font-size: 15px;
            word-break: break-word;
        }

        .loading {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        .error {
            color: #b91c1c;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 640px) {

            .info-grid {
                grid-template-columns: 1fr;
            }

            .profile-header {
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>

<div class="app">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">

                <span class="logo-c">C</span>
                <span class="logo-h">H</span>

            </div>

            <div>

                <h1>CasaHome</h1>

                <span>
                    Management System
                </span>

            </div>

        </div>


        <nav class="sidebar-nav">

            <a
                href="user-dashboard.html"
                class="nav-link"
            >

                <span>▦</span>

                Dashboard

            </a>


            <a
                href="user-room.html"
                class="nav-link"
            >

                <span>▤</span>

                My Room

            </a>


            <a
                href="user-payments.html"
                class="nav-link"
            >

                <span>₱</span>

                My Payments

            </a>


            <a
                href="user-profile.html"
                class="nav-link active"
            >

                <span>♙</span>

                My Profile

            </a>

        </nav>


        <div class="sidebar-footer">

            <strong>CasaHome</strong>

            <small>
                Tenant Portal
            </small>

        </div>

    </aside>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main-content">


        <!-- TOPBAR -->

        <header class="topbar">

            <div>

                <div class="user-badge">
                    👤 TENANT
                </div>

                <p class="eyebrow">
                    Tenant Portal
                </p>

                <h2>
                    My Profile
                </h2>

                <p class="subtitle">
                    View your CasaHome tenant account information.
                </p>

            </div>


            <div class="dashboard-actions">

                <button
                    id="logoutBtn"
                    type="button"
                    class="btn btn-user"
                >

                    Logout

                </button>

            </div>

        </header>



        <!-- =====================================================
             PROFILE
             ===================================================== -->

        <section class="page-card">

            <div
                id="profileContent"
                class="loading"
            >

                Loading your profile...

            </div>

        </section>

    </main>

</div>



<script src="assets/js/supabase.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {


        let currentTenantId =
            null;

        let currentSession =
            null;



        /* =====================================================
           CHECK ACCESS
           ===================================================== */

        async function checkTenantAccess() {

            const client =
                await getClient();


            const {
                data: {
                    session
                }
            } = await client.auth.getSession();


            if (!session) {

                window.location.replace(
                    "index.html"
                );

                return null;

            }


            const {
                data: profile,
                error
            } = await client
                .from("profiles")
                .select(
                    "role, tenant_id"
                )
                .eq(
                    "id",
                    session.user.id
                )
                .single();


            if (
                error ||
                !profile ||
                profile.role !== "user" ||
                !profile.tenant_id
            ) {

                await client.auth.signOut();

                window.location.replace(
                    "index.html"
                );

                return null;

            }


            currentTenantId =
                profile.tenant_id;


            currentSession =
                session;


            return client;

        }



        /* =====================================================
           LOAD PROFILE
           ===================================================== */

        async function loadProfile() {

            const client =
                await checkTenantAccess();


            if (!client) {
                return;
            }


            const {
                data: tenant,
                error
            } = await client
                .from("tenants")
                .select(`
                    id,
                    full_name,
                    contact_number,
                    room_id,
                    move_in_date,
                    status,
                    rooms (
                        room_number,
                        room_type,
                        rate
                    )
                `)
                .eq(
                    "id",
                    currentTenantId
                )
                .single();


            if (error) {
                throw error;
            }


            const room =
                tenant.rooms;


            const name =
                tenant.full_name ||
                "Tenant";


            const firstLetter =
                name
                    .replace(
                        /^Mr\.\s+|^Mrs\.\s+/i,
                        ""
                    )
                    .charAt(0)
                    .toUpperCase();


            document.getElementById(
                "profileContent"
            ).innerHTML = `

                <div class="profile-header">

                    <div class="profile-avatar">

                        ${esc(firstLetter)}

                    </div>


                    <div>

                        <div class="profile-name">

                            ${esc(
                                tenant.full_name
                            )}

                        </div>


                        <div class="profile-email">

                            ${esc(
                                currentSession
                                    .user
                                    .email ||
                                "No email available"
                            )}

                        </div>

                    </div>

                </div>



                <div class="info-grid">


                    <div class="info-item">

                        <span>
                            Full Name
                        </span>

                        <strong>
                            ${esc(
                                tenant.full_name
                            )}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            Email Address
                        </span>

                        <strong>
                            ${esc(
                                currentSession
                                    .user
                                    .email ||
                                "—"
                            )}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            Contact Number
                        </span>

                        <strong>
                            ${esc(
                                tenant.contact_number ||
                                "—"
                            )}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            Room Number
                        </span>

                        <strong>
                            ${esc(
                                room?.room_number ||
                                "Unassigned"
                            )}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            Room Type
                        </span>

                        <strong>
                            ${esc(
                                room?.room_type ||
                                "—"
                            )}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            Monthly Rate
                        </span>

                        <strong>
                            ${money(
                                room?.rate ||
                                0
                            )}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            Move-in Date
                        </span>

                        <strong>
                            ${date(
                                tenant.move_in_date
                            )}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            Tenant Status
                        </span>

                        <strong>
                            ${esc(
                                tenant.status
                            )}
                        </strong>

                    </div>


                </div>

            `;

        }



        /* =====================================================
           LOGOUT
           ===================================================== */

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                async () => {

                    try {

                        const client =
                            await getClient();

                        await client.auth.signOut();

                    } catch (error) {

                        console.error(
                            error
                        );

                    }

                    window.location.replace(
                        "index.html"
                    );

                }
            );



        /* =====================================================
           START
           ===================================================== */

        try {

            await loadProfile();

        } catch (error) {

            console.error(
                "Profile error:",
                error
            );


            document.getElementById(
                "profileContent"
            ).innerHTML = `

                <div class="error">

                    Unable to load your profile.

                </div>

            `;

        }

    }

);

</script>

</body>

</html>
