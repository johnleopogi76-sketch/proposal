<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* CH Logo */
  .ch-logo {
    position: relative;
    width: 82px;
    height: 82px;
    margin-left: auto;
    margin-right: auto;

    font-family: Georgia, "Times New Roman", serif;
    color: #ffffff;

    overflow: hidden;
  }

  .logo-c {
    position: absolute;
    left: 0;
    top: -13px;

    font-size: 78px;
    font-weight: 700;
    line-height: 1;

    z-index: 1;
  }

  .logo-h {
    position: absolute;
    right: -2px;
    bottom: -13px;

    font-size: 78px;
    font-weight: 700;
    line-height: 1;

    z-index: 2;
  }

  .ch-glow {
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-8px);
    }
  }
  </style>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-6">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="ch-logo ch-glow mx-auto mb-4">
          <span class="logo-c">C</span>
          <span class="logo-h">H</span>
      </div>
      <h1 class="text-3xl font-black text-white">CasaHome</h1>
      <p class="text-slate-400 mt-1">Admin Portal</p>
    </div>

    <div class="bg-white rounded-2xl shadow-2xl p-7">
      <div class="mb-6">
        <h2 class="text-xl font-bold text-slate-900">Admin Login</h2>
        <p class="text-sm text-slate-500 mt-1">Sign in to manage your CasaHome system.</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
          <input id="email" type="email" required autocomplete="email"
            placeholder="admin@casahome.com"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100">
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
          <input id="password" type="password" required autocomplete="current-password"
            placeholder="Enter your password"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100">
        </div>

        <div id="message" class="hidden rounded-xl px-4 py-3 text-sm"></div>

        <button id="loginBtn" type="submit"
          class="w-full rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 transition disabled:opacity-60 disabled:cursor-not-allowed">
          Sign In
        </button>
      </form>

      <p class="text-center text-xs text-slate-400 mt-6">
        Authorized administrators only.
      </p>
    </div>
  </div>

  <script src="assets/js/supabase.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className =
        "rounded-xl px-4 py-3 text-sm " +
        (type === "success"
          ? "bg-emerald-50 text-emerald-700"
          : "bg-rose-50 text-rose-700");
    }

    async function getSupabase() {
      return await getClient();
    }

    async function checkExistingAdmin() {
      try {
        const client = await getSupabase();
        const { data: { session } } = await client.auth.getSession();

        if (!session) return;

        const { data: profile, error } = await client
          .from("profiles")
          .select("role")
          .eq("id", session.user.id)
          .single();

        if (!error && profile?.role === "admin") {
          window.location.href = "admin-dashboard.html";
        }
      } catch (error) {
        console.log("No existing admin session.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";
      message.classList.add("hidden");

      try {
        const client = await getSupabase();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        const { data: profile, error: profileError } = await client
          .from("profiles")
          .select("role")
          .eq("id", data.user.id)
          .single();

        if (profileError || !profile || profile.role !== "admin") {
          await client.auth.signOut();
          throw new Error("This account is not authorized as an administrator.");
        }

        showMessage("Login successful. Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 500);

      } catch (error) {
        showMessage(error.message || "Unable to sign in.");
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    });

    checkExistingAdmin();
  </script>
</body>
</html>
