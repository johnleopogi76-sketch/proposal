<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CasaHome room management">
    <title>Rooms</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Clickable room status filters */
        .room-status-filters {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .room-filter {
            appearance: none;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #64748b;
            border-radius: 999px;
            padding: 7px 11px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .room-filter:hover {
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .room-filter.active {
            color: #0f172a;
            border-color: #cbd5e1;
            box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.04);
        }

        .room-filter .filter-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: 0 0 7px;
        }

        .room-filter .filter-count {
            min-width: 20px;
            padding: 2px 6px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #475569;
            font-size: 11px;
            line-height: 1.2;
        }

        .room-filter.vacant .filter-dot {
            background: #94a3b8;
        }

        .room-filter.occupied .filter-dot {
            background: #10b981;
        }

        .room-filter.maintenance .filter-dot {
            background: #f59e0b;
        }

        .room-filter.vacant.active {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .room-filter.occupied.active {
            background: #ecfdf5;
            border-color: #a7f3d0;
            color: #047857;
        }

        .room-filter.maintenance.active {
            background: #fffbeb;
            border-color: #fde68a;
            color: #b45309;
        }

        .room-filter.all.active {
            background: #f8fafc;
        }

        /* Admin indicator */
        .admin-context {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-left: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
            font-size: 12px;
            font-weight: 700;
        }

        .admin-context-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
        }

        @media (max-width: 800px) {
            .room-status-filters {
                justify-content: flex-start;
                width: 100%;
                margin-top: 12px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-context {
                margin-left: 0;
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="brand">
                <div class="brand-icon">
                    <span class="logo-c">C</span>
                    <span class="logo-h">H</span>
                </div>

                <div>
                    <h1>CasaHome</h1>
                    <span>Management System</span>
                </div>
            </div>

            <nav class="sidebar-nav">

                <!-- Dashboard changes automatically for admin -->
                <a href="index.html" id="dashboardLink" class="nav-link">
                    <span>▦</span>
                    Dashboard
                </a>

                <a href="rooms.html" class="nav-link active">
                    <span>▤</span>
                    Rooms
                </a>

                <a href="tenants.html" class="nav-link">
                    <span>♙</span>
                    Customers
                </a>

                <a href="billing.html" class="nav-link">
                    <span>₱</span>
                    Billing
                </a>

            </nav>

            <div class="sidebar-footer">
                <strong>CasaHome</strong>
                <small>Web-based prototype</small>
            </div>

        </aside>

        <!-- Main -->
        <main class="main-content">

            <header class="topbar">

                <div>
                    <p class="eyebrow">Property</p>

                    <h2>
                        Room Management

                        <span id="adminContext" class="admin-context" style="display:none;">
                            <span class="admin-context-dot"></span>
                            Admin Mode
                        </span>
                    </h2>

                    <p class="subtitle">
                        View room availability and update room status.
                    </p>
                </div>

                <!-- Clickable status filters -->
                <div class="room-status-filters" aria-label="Room status filters">

                    <button type="button"
                            class="room-filter all"
                            data-filter="All">
                        <span>All</span>
                        <span class="filter-count" id="allCount">0</span>
                    </button>

                    <button type="button"
                            class="room-filter vacant"
                            data-filter="Vacant">
                        <i class="filter-dot"></i>
                        <span>Vacant</span>
                        <span class="filter-count" id="vacantCount">0</span>
                    </button>

                    <button type="button"
                            class="room-filter occupied"
                            data-filter="Occupied">
                        <i class="filter-dot"></i>
                        <span>Occupied</span>
                        <span class="filter-count" id="occupiedCount">0</span>
                    </button>

                    <button type="button"
                            class="room-filter maintenance"
                            data-filter="Maintenance">
                        <i class="filter-dot"></i>
                        <span>Maintenance</span>
                        <span class="filter-count" id="maintenanceCount">0</span>
                    </button>

                </div>

            </header>

            <section class="card">

                <div class="section-header">

                    <div>
                        <h3>Room Matrix</h3>

                        <p id="roomCount">
                            Loading rooms...
                        </p>
                    </div>

                </div>

                <div id="roomGrid" class="room-grid">

                    <div class="loading">
                        Loading rooms...
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="assets/js/supabase.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            const grid = document.getElementById("roomGrid");
            const roomCount = document.getElementById("roomCount");

            const allCount = document.getElementById("allCount");
            const vacantCount = document.getElementById("vacantCount");
            const occupiedCount = document.getElementById("occupiedCount");
            const maintenanceCount = document.getElementById("maintenanceCount");

            const filterButtons =
                document.querySelectorAll(".room-filter");

            const dashboardLink =
                document.getElementById("dashboardLink");

            const adminContext =
                document.getElementById("adminContext");

            let allRooms = [];
            let activeFilter = "All";

            /*
             * Detect whether the current browser session
             * belongs to an admin.
             */
            async function setupNavigation() {

                try {

                    const client = await getClient();

                    const {
                        data: {
                            session
                        }
                    } = await client.auth.getSession();

                    /*
                     * No logged-in user:
                     * keep normal public navigation.
                     */
                    if (!session) {
                        dashboardLink.href = "index.html";
                        return;
                    }

                    /*
                     * Check the user's role in profiles.
                     */
                    const {
                        data: profile,
                        error
                    } = await client
                        .from("profiles")
                        .select("role")
                        .eq("id", session.user.id)
                        .maybeSingle();

                    if (error) {
                        console.error(
                            "Unable to check user role:",
                            error
                        );

                        dashboardLink.href = "index.html";
                        return;
                    }

                    /*
                     * Admin session detected.
                     */
                    if (profile?.role === "admin") {

                        dashboardLink.href = "admin-index.html";

                        adminContext.style.display = "inline-flex";

                    } else {

                        dashboardLink.href = "index.html";

                    }

                } catch (error) {

                    console.error(
                        "Navigation setup error:",
                        error
                    );

                    dashboardLink.href = "index.html";
                }
            }


            function updateCounts(rooms) {

                const vacant =
                    rooms.filter(
                        room => room.status === "Vacant"
                    ).length;

                const occupied =
                    rooms.filter(
                        room => room.status === "Occupied"
                    ).length;

                const maintenance =
                    rooms.filter(
                        room => room.status === "Maintenance"
                    ).length;

                allCount.textContent = rooms.length;
                vacantCount.textContent = vacant;
                occupiedCount.textContent = occupied;
                maintenanceCount.textContent = maintenance;
            }


            function updateActiveFilter() {

                filterButtons.forEach(button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.filter === activeFilter
                    );

                });
            }


            function renderRooms(rooms) {

                if (!rooms.length) {

                    grid.innerHTML = `
                        <div class="empty-state">
                            No ${
                                activeFilter === "All"
                                    ? ""
                                    : activeFilter.toLowerCase() + " "
                            }rooms found.
                        </div>
                    `;

                    return;
                }

                grid.innerHTML = rooms.map(room => `

                    <article class="room-card">

                        <div class="room-card-top">

                            <div>

                                <span class="room-label">
                                    ROOM
                                </span>

                                <h3>
                                    ${esc(room.room_number)}
                                </h3>

                            </div>

                            <span class="badge ${statusClass(room.status)}">
                                ${esc(room.status)}
                            </span>

                        </div>

                        <div class="room-details">

                            <div>

                                <span>Type</span>

                                <strong>
                                    ${esc(room.room_type || "Standard")}
                                </strong>

                            </div>

                            <div>

                                <span>Monthly Rate</span>

                                <strong>
                                    ${money(room.rate)}
                                </strong>

                            </div>

                        </div>

                        <label class="form-label">

                            Update Status

                            <select
                                class="form-control room-status"
                                data-room-id="${room.id}"
                                data-current="${esc(room.status)}"
                            >

                                <option value="Vacant"
                                    ${room.status === "Vacant" ? "selected" : ""}>
                                    Vacant
                                </option>

                                <option value="Occupied"
                                    ${room.status === "Occupied" ? "selected" : ""}>
                                    Occupied
                                </option>

                                <option value="Maintenance"
                                    ${room.status === "Maintenance" ? "selected" : ""}>
                                    Maintenance
                                </option>

                            </select>

                        </label>

                    </article>

                `).join("");


                document
                    .querySelectorAll(".room-status")
                    .forEach(select => {

                        select.addEventListener(
                            "change",
                            async event => {

                                const roomId =
                                    event.target.dataset.roomId;

                                const newStatus =
                                    event.target.value;

                                const previousStatus =
                                    event.target.dataset.current;

                                try {

                                    await updateRoomStatus(
                                        roomId,
                                        newStatus
                                    );

                                    await loadRooms();

                                } catch (error) {

                                    console.error(error);

                                    alert(
                                        "Unable to update room status."
                                    );

                                    event.target.value =
                                        previousStatus;
                                }

                            }
                        );

                    });
            }


            function applyFilter() {

                const filteredRooms =
                    activeFilter === "All"
                        ? allRooms
                        : allRooms.filter(
                            room =>
                                room.status === activeFilter
                        );

                roomCount.textContent =
                    activeFilter === "All"
                        ? `${allRooms.length} rooms registered`
                        : `${filteredRooms.length} ${activeFilter.toLowerCase()} rooms`;

                renderRooms(filteredRooms);

                updateActiveFilter();
            }


            async function loadRooms() {

                try {

                    const rooms =
                        await fetchRooms();

                    allRooms =
                        rooms || [];

                    updateCounts(allRooms);

                    applyFilter();

                } catch (error) {

                    console.error(error);

                    grid.innerHTML = `
                        <div class="empty-state error">
                            Unable to load rooms.
                        </div>
                    `;
                }
            }


            filterButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const selectedFilter =
                            button.dataset.filter;

                        /*
                         * Clicking the currently selected status
                         * returns the user to all rooms.
                         */
                        if (
                            activeFilter === selectedFilter &&
                            selectedFilter !== "All"
                        ) {

                            activeFilter = "All";

                        } else {

                            activeFilter =
                                selectedFilter;
                        }

                        applyFilter();

                    }
                );

            });


            /*
             * First detect admin session,
             * then load rooms.
             */
            await setupNavigation();

            await loadRooms();

            subscribeToRooms(loadRooms);

        });
    </script>

</body>

</html>
