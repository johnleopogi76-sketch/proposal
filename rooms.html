<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="RentEase room management">
        <title>Rooms</title>
        
        <link rel="stylesheet" href="style.css">
</head>

<body>
        
        <div class="app">
                
                <!-- Sidebar -->
                <aside class="sidebar">
                        
                        <div class="brand">
                                <div class="brand-icon">R</div>
                                
                                <div>
                                        <h1>RentEase</h1>
                                        <span>Management System</span>
                                </div>
                        </div>
                        
                        <nav class="sidebar-nav">
                                
                                <a href="index.html" class="nav-link">
                                        <span>▦</span>
                                        Dashboard
                                </a>
                                
                                <a href="rooms.html" class="nav-link active">
                                        <span>▤</span>
                                        Rooms
                                </a>
                                
                                <a href="tenants.html" class="nav-link">
                                        <span>♙</span>
                                        Customers
                                </a>
                                
                                <a href="billing.html" class="nav-link">
                                        <span>₱</span>
                                        Billing
                                </a>
                                
                        </nav>
                        
                        <div class="sidebar-footer">
                                <strong>RentEase</strong>
                                <small>Web-based prototype</small>
                        </div>
                        
                </aside>
                
                <!-- Main -->
                <main class="main-content">
                        
                        <header class="topbar">
                                
                                <div>
                                        <p class="eyebrow">Property</p>
                                        
                                        <h2>Room Management</h2>
                                        
                                        <p class="subtitle">
                                                View room availability and update room status.
                                        </p>
                                </div>
                                
                                <div class="legend">
                                        
                                        <span>
                                                <i class="dot vacant"></i>
                                                Vacant
                                        </span>
                                        
                                        <span>
                                                <i class="dot occupied"></i>
                                                Occupied
                                        </span>
                                        
                                        <span>
                                                <i class="dot maintenance"></i>
                                                Maintenance
                                        </span>
                                        
                                </div>
                                
                        </header>
                        
                        <section class="card">
                                
                                <div class="section-header">
                                        
                                        <div>
                                                <h3>Room Matrix</h3>
                                                <p id="roomCount">
                                                        Loading rooms...
                                                </p>
                                        </div>
                                        
                                </div>
                                
                                <div id="roomGrid" class="room-grid">
                                        
                                        <div class="loading">
                                                Loading rooms...
                                        </div>
                                        
                                </div>
                                
                        </section>
                        
                </main>
                
        </div>
        
        <script src="assets/js/supabase.js"></script>
        
        <script>
                document.addEventListener("DOMContentLoaded", async () => {
                        
                        const grid = document.getElementById("roomGrid");
                        const roomCount = document.getElementById("roomCount");
                        
                        async function loadRooms() {
                                
                                try {
                                        
                                        const rooms = await fetchRooms();
                                        
                                        roomCount.textContent =
                                                `${rooms.length} rooms registered`;
                                        
                                        if (!rooms.length) {
                                                
                                                grid.innerHTML = `
                    <div class="empty-state">
                        No rooms found.
                    </div>
                `;
                                                
                                                return;
                                        }
                                        
                                        grid.innerHTML = rooms.map(room => `

                <article class="room-card">

                    <div class="room-card-top">

                        <div>
                            <span class="room-label">
                                ROOM
                            </span>

                            <h3>
                                ${esc(room.room_number)}
                            </h3>
                        </div>

                        <span class="badge ${statusClass(room.status)}">
                            ${esc(room.status)}
                        </span>

                    </div>

                    <div class="room-details">

                        <div>
                            <span>Type</span>
                            <strong>
                                ${esc(room.room_type || "Standard")}
                            </strong>
                        </div>

                        <div>
                            <span>Monthly Rate</span>
                            <strong>
                                ${money(room.rate)}
                            </strong>
                        </div>

                    </div>

                    <label class="form-label">
                        Update Status

                        <select
                            class="form-control room-status"
                            data-room-id="${room.id}"
                            data-current="${esc(room.status)}"
                        >

                            <option value="Vacant"
                                ${room.status === "Vacant" ? "selected" : ""}>
                                Vacant
                            </option>

                            <option value="Occupied"
                                ${room.status === "Occupied" ? "selected" : ""}>
                                Occupied
                            </option>

                            <option value="Maintenance"
                                ${room.status === "Maintenance" ? "selected" : ""}>
                                Maintenance
                            </option>

                        </select>

                    </label>

                </article>

            `).join("");
                                        
                                        document
                                                .querySelectorAll(".room-status")
                                                .forEach(select => {
                                                        
                                                        select.addEventListener("change", async event => {
                                                                
                                                                const roomId =
                                                                        event.target.dataset.roomId;
                                                                
                                                                const newStatus =
                                                                        event.target.value;
                                                                
                                                                try {
                                                                        
                                                                        await updateRoomStatus(
                                                                                roomId,
                                                                                newStatus
                                                                        );
                                                                        
                                                                        await loadRooms();
                                                                        
                                                                } catch (error) {
                                                                        
                                                                        console.error(error);
                                                                        
                                                                        alert(
                                                                                "Unable to update room status."
                                                                        );
                                                                        
                                                                        event.target.value =
                                                                                event.target.dataset.current;
                                                                }
                                                                
                                                        });
                                                        
                                                });
                                        
                                } catch (error) {
                                        
                                        console.error(error);
                                        
                                        grid.innerHTML = `
                <div class="empty-state error">
                    Unable to load rooms.
                </div>
            `;
                                }
                        }
                        
                        await loadRooms();
                        
                        subscribeToRooms(loadRooms);
                        
                });
        </script>
        
</body>

</html>
